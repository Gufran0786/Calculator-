name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          JAVA_VER_STR=$(java -version 2>&1 | head -n 1)
          echo "Detected version string: $JAVA_VER_STR"
          
          # Extract major version number
          JAVA_MAJOR=$(echo "$JAVA_VER_STR" | sed -E 's/.*version "([0-9]+).*/\1/')
          
          if [ -z "$JAVA_MAJOR" ] || ! [ "$JAVA_MAJOR" -eq "$JAVA_MAJOR" ] 2>/dev/null; then
            echo "ERROR: Unable to detect Java major version from '$JAVA_VER_STR'"
            exit 1
          fi
          
          echo "Active Java major version: $JAVA_MAJOR"
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          
          echo "Java environment verified successfully: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking debug keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore does not exist after generation attempt."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "=== Verifying APK output ==="
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            echo "Discovered APK files in app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file at $EXPECTED_APK is empty."
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: $EXPECTED_APK does not have .apk extension"; exit 1 ;;
          esac
          
          echo "APK successfully verified at: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$ORIGINAL_APK" ] || [ ! -s "$ORIGINAL_APK" ]; then
            echo "ERROR: Original APK is missing or empty."
            exit 1
          fi
          
          # Derive clean repository name
          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}')
          fi
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME="android-app"
          fi
          
          CLEAN_REPO_NAME=$(echo "$RAW_REPO_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
          ASSET_NAME="${CLEAN_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          
          TEMP_ASSET_DIR="${RUNNER_TEMP:-/tmp}/release_asset"
          mkdir -p "$TEMP_ASSET_DIR"
          
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_NAME}"
          cp "$ORIGINAL_APK" "$ASSET_PATH"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi
          
          echo "Release asset prepared: $ASSET_PATH ($ASSET_NAME)"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty at $ASSET_PATH"
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Asset does not have .apk extension"; exit 1 ;;
          esac
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          cat << 'EOF' > release_notes.md
          ### Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run:** #${{ github.run_number }}
          - **Run Attempt:** #${{ github.run_attempt }}
          - **Commit SHA:** `${{ github.sha }}`
          - **Asset Name:** `${ASSET_NAME}`

          > **Note:**
          > - This APK is intended for testing purposes only.
          > - This is not a Google Play Store production release.
          > - The APK is signed with a temporary debug keystore.
          EOF
          
          # Replace variable placeholder in release notes
          sed -i "s/\${ASSET_NAME}/$ASSET_NAME/g" release_notes.md
          
          echo "Creating GitHub Release with tag: $TAG"
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest
          
          echo "GitHub Release created successfully."
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Build & Release Summary ==="
          
          RELEASE_SUCCESS="${{ steps.create_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          echo "## Android Debug APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** Debug APK built successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** \`app-debug-apk\` (available under workflow summary)" >> "$GITHUB_STEP_SUMMARY"
          
          if [ "$RELEASE_SUCCESS" = "success" ]; then
            echo "GitHub Release was published successfully!"
            gh release view "$RELEASE_TAG" || true
            
            REPO_URL="${{ github.server_url }}/${{ github.repository }}"
            RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            
            echo "- **GitHub Release:** [$RELEASE_TAG]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Asset:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📱 **Download Instructions:** You can download the APK directly to your phone from the release **Assets** section at the link above, or from the Actions artifact below." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation step did not complete successfully or was skipped."
            echo "The APK was built successfully and is preserved in the Actions artifact: app-debug-apk"
            
            echo "- **GitHub Release:** ⚠️ Release creation encountered an issue or was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Download:** Download the \`app-debug-apk\` artifact from this workflow run." >> "$GITHUB_STEP_SUMMARY"
          fi
